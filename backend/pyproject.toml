[project]
name = "jyotish-agent-backend"
version = "0.1.0"
description = "Django backend for Jyotish Agent"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "django-cors-headers>=4.7,<4.8",
  "gunicorn>=23.0,<24.0",
  "geonamescache>=2.0,<2.1",
  "indic-transliteration>=2.3,<2.4",
  "pymupdf>=1.26,<1.27",
  "psycopg[binary]>=3.2,<3.3",
  "python-dotenv>=1.1,<1.2",
  "timezonefinder>=8.1,<8.2",
  "whitenoise>=6.9,<6.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
  "pytest-django>=4.11,<4.12",
  "ruff>=0.11,<0.12",
]
swisseph = [
  "pyswisseph==2.10.3.2",
]
jhora-capture = [
  "Pillow>=11.0,<12.0",
  "pywinauto>=0.6.9,<0.7",
  "pywin32>=312; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
