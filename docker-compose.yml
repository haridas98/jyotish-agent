services:
  postgres:
    image: postgres:17
    container_name: jyotish-agent-postgres
    environment:
      POSTGRES_DB: jyotish_agent
      POSTGRES_USER: jyotish
      POSTGRES_PASSWORD: jyotish
    ports:
      - "55439:5432"
    volumes:
      - jyotish_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jyotish -d jyotish_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jyotish-agent-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: jyotish-agent-backend
    environment:
      DJANGO_SECRET_KEY: local-compose-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3130,http://localhost:3130
      DATABASE_URL: postgres://jyotish:jyotish@postgres:5432/jyotish_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8100"

  frontend:
    build:
      context: ./frontend
    container_name: jyotish-agent-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
    ports:
      - "3130:3130"
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0 --port 3130

volumes:
  jyotish_postgres_data:
